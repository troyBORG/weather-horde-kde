name: Checks and releases

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    name: Native Plasma 6 and fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build pinned Arch toolchain
        run: docker build --tag weather-horde-ci .github/ci
      - name: Native package, full suite, and public artifacts
        env:
          CI_REF: ${{ github.ref }}
          CI_SHA: ${{ github.sha }}
        run: |
          docker create --name native --network none --cap-drop ALL --security-opt no-new-privileges \
            --mount type=bind,source="$GITHUB_WORKSPACE",target=/source,readonly \
            --env CI_REF --env CI_SHA weather-horde-ci \
            bash -euc 'git -c safe.directory=/source clone --no-hardlinks /source repo; cd repo; python scripts/ci_check.py'
          docker start --attach native
          docker cp native:/home/ci/repo/public ./public
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  release:
    name: Publish tested assets
    needs: checks
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.run_id }}-${{ github.run_attempt }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public
      - name: Verify hashes, publish draft, verify uploaded bytes, then expose release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_release.py
